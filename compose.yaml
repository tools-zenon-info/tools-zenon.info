name: tools-zenon-info

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # zt-server's postgresql2 (resolved against Dart 2.19) only supports MD5
      # auth. nom-indexer's newer postgresql2 (Dart 3.x) supports SCRAM, but
      # MD5 works for both. Postgres 16 defaults to SCRAM, so we override.
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./configs/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [zt-net]
    logging: *default-logging

  znnd-bootstrap:
    build:
      context: ./scripts
      dockerfile: ../dockerfiles/znnd-bootstrap.Dockerfile
    # One-shot: no-ops if /data/nom exists (and FORCE_BOOTSTRAP != true).
    restart: "no"
    environment:
      BOOTSTRAP_URL: ${ZNND_BOOTSTRAP_URL:-}
      FORCE_BOOTSTRAP: ${ZNND_FORCE_BOOTSTRAP:-false}
    volumes:
      - znnd_data:/data
    networks: [zt-net]
    logging: *default-logging

  znnd:
    build:
      context: ./dockerfiles
      dockerfile: znnd.Dockerfile
      args:
        ZNND_GIT_REF: ${ZNND_GIT_REF}
    restart: unless-stopped
    depends_on:
      znnd-bootstrap:
        condition: service_completed_successfully
    ports:
      # P2P only; RPC/WS stay internal to the compose network.
      - "35995:35995/tcp"
      - "35995:35995/udp"
    volumes:
      - znnd_data:/root/.znn
      # Override znnd's HTTPVirtualHosts (default is empty -> localhost-only),
      # so refiner/other clients on the docker network can reach the HTTP RPC.
      - ./configs/znnd.config.json:/root/.znn/config.json:ro
    healthcheck:
      # znnd's RPC rejects localhost-Host requests with 403 (whitelist-based),
      # but the daemon is still alive and serving the docker network. We
      # treat "got any HTTP response" as healthy — i.e. the RPC is bound and
      # the process is responsive. Drop -f so 4xx codes don't fail the check.
      test: ["CMD-SHELL", "curl -sS -o /dev/null --connect-timeout 5 http://localhost:35997 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [zt-net]
    logging: *default-logging

  nom-indexer:
    build:
      context: ../nom-indexer
      dockerfile: ../tools.zenon.info/dockerfiles/indexer.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      znnd:
        condition: service_started
    volumes:
      - ./configs/indexer.config.yaml:/app/config.yaml:ro
    networks: [zt-net]
    logging: *default-logging

  nom-refiner:
    build:
      context: ../nom-data-refiner
      dockerfile: ../tools.zenon.info/dockerfiles/refiner.Dockerfile
    restart: unless-stopped
    depends_on:
      znnd:
        condition: service_started
    volumes:
      - refiner_data:/app/nom_data_refiner/data_store
      - ./configs/refiner.config.json:/app/nom_data_refiner/config/config.json:ro
    networks: [zt-net]
    logging: *default-logging

  eth-pool-indexer:
    build:
      context: ../eth-pool-indexer
      dockerfile: ../tools.zenon.info/dockerfiles/eth-pool-indexer.Dockerfile
    restart: unless-stopped
    environment:
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY}
      DATA_DIR: /data/refiner
      REFRESH_INTERVAL_SECONDS: ${ETH_POOL_REFRESH_SECONDS:-300}
    volumes:
      # Writes the three *_cache.json files the nom-refiner consumes.
      - refiner_data:/data/refiner
    networks: [zt-net]
    logging: *default-logging

  zt-server:
    build:
      context: ../zt-server
      dockerfile: ../tools.zenon.info/dockerfiles/zt-server.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nom-indexer:
        condition: service_started
    volumes:
      - refiner_data:/data/refiner:ro
      - pillars_data:/data/pillars
      - stats_data:/data/stats
      - ./configs/zt-server.config.yaml:/app/config.yaml:ro
    expose:
      - "8080"
    networks: [zt-net]
    logging: *default-logging

  frontend:
    build:
      context: ../zt-frontend
      dockerfile: ../tools.zenon.info/dockerfiles/frontend.Dockerfile
      args:
        ZT_API_URL: https://${DOMAIN_API}
        COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
    # One-shot: builds static assets into the frontend_dist volume and exits.
    restart: "no"
    volumes:
      - frontend_dist:/dist
    networks: [zt-net]
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN_FRONTEND: ${DOMAIN_FRONTEND}
      DOMAIN_API: ${DOMAIN_API}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      frontend:
        condition: service_completed_successfully
      zt-server:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [zt-net]
    logging: *default-logging

networks:
  zt-net:
    driver: bridge

volumes:
  pg_data:
  znnd_data:
  refiner_data:
  pillars_data:
  stats_data:
  frontend_dist:
  caddy_data:
  caddy_config:
