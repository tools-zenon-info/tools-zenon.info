# Portainer + caddy-docker-proxy integration.
#
# Activate by setting COMPOSE_FILE=compose.yaml:compose.caddy-proxy.yaml as
# a stack env var (or `docker compose -f compose.yaml -f compose.caddy-proxy.yaml ...`).
#
# Replaces the bundled Caddy with lucaslorentz/caddy-docker-proxy labels.
# The external Caddy (running outside this stack) reads the labels and
# auto-configures routing + TLS for the two domains.
#
# Adds an nginx "frontend-server" sidecar because caddy-docker-proxy can
# only reverse-proxy to other containers, not serve static files directly.
# The nginx mounts the same `frontend_dist` volume the bundled Caddy used.
#
# SECURITY NOTE: this override does NOT enforce the same Origin-header check
# the bundled Caddy did. The API will respond to any cross-origin request
# whose Origin matches zt-server's wide-open `Access-Control-Allow-Origin: *`.
# If you want the lockdown back, add caddy.* labels with the matcher logic,
# or apply it in your external caddy-docker-proxy's global config.

services:
  # Bundled Caddy is unused — caddy-docker-proxy handles TLS.
  # Profiling the service out means it's defined but never started.
  caddy:
    profiles: ["disabled-by-caddy-docker-proxy"]

  # Static-file server for the SPA. Reads from the same frontend_dist
  # volume the bundled Caddy used to serve from.
  frontend-server:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_completed_successfully
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./configs/nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [zt-net, caddy-proxy]
    labels:
      caddy: ${DOMAIN_FRONTEND}
      caddy.reverse_proxy: "{{upstreams 80}}"

  zt-server:
    # Add labels for caddy-docker-proxy + join the external Caddy network.
    networks: [zt-net, caddy-proxy]
    labels:
      caddy: ${DOMAIN_API}
      caddy.reverse_proxy: "{{upstreams 8080}}"

networks:
  caddy-proxy:
    # The external Caddy's network — typically created by your
    # caddy-docker-proxy compose stack. Adjust `name:` if yours differs.
    external: true
    name: caddy
