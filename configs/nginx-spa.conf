# Serves the Angular SPA from /usr/share/nginx/html.
# Used only in caddy-docker-proxy mode (see compose.caddy-proxy.yaml).
# The external Caddy terminates TLS and reverse-proxies to this nginx
# on port 80 over the docker network.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Long-cache hashed assets from Angular's build (filenames include content hash).
    location ~* \.(js|css|woff2|png|svg|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
